openapi: 3.1.0
info:
  title: VideoMind target API contracts
  version: 1.0.0
  description: 待实施目标合同，不代表当前仓库已提供这些路由。由adapter与现有路由共存。workspace来自验证后的Bearer身份和membership；客户端不能任意指定workspace。
servers:
- url: http://localhost:8000
security:
- BearerAuth: []
paths:
