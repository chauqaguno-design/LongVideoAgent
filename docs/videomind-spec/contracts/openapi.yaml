    get:
      operationId: getCapabilities
      summary: 模型与专用能力状态
      description: 资源权限由服务端身份和workspace membership校验。
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Capabilities
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Error
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Error
        '404':
          description: Not found or not authorized
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Error
        '409':
          description: Version, idempotency or state conflict
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Error
        '422':
          description: Schema or media invariant invalid
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Error
        '429':
          description: Rate or budget limit
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Error
        '503':
          description: Required capability unavailable
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Error
