<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>映溯 CineTrace · 视频工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>映溯</strong><span class="wordmark">CineTrace</span></div>
    <div class="workspace-name">视频工作台</div>
    <button type="button" class="primary" data-choose><span aria-hidden="true">＋</span> 上传视频</button>
    <input type="file" id="file" accept=".mp4,video/mp4" hidden>
  </header>

  <div class="workspace">
    <aside class="library">
      <div class="section-heading"><h2>素材库</h2><span class="number" id="video-count">0</span></div>
      <div id="history" class="history"></div>
      <div class="upload-note">
        <strong>上传说明</strong>
        <p>支持 H.264 MP4。上传中断后，重新选择同一文件即可续传。</p>
        <p>原片保存在本机。配置百炼时，视觉分析会将短片发往对应工作空间。</p>
      </div>
    </aside>

    <main>
      <section id="upload-progress" class="upload-card" hidden aria-live="polite">
        <div class="section-heading"><strong id="upload-name"></strong><span id="upload-value" class="number"></span></div>
        <progress id="upload-bar" max="100" value="0"></progress>
        <div class="upload-details"><span id="upload-message"></span><button id="pause-upload" type="button" class="quiet">暂停上传</button></div>
      </section>
      <div id="notice" class="notice" role="status" hidden></div>

      <div class="title-row">
        <div><h1 id="title">原片工作区</h1><p id="metadata">选择素材或上传一份视频</p></div>
        <span id="job-status" class="badge" hidden></span>
      </div>

      <div class="monitor-grid">
        <section class="monitor" aria-label="原片播放器">
          <div class="monitor-header"><h2>原片预览</h2><span class="time" id="play-time">00:00</span></div>
          <div id="drop-zone" class="screen">
            <button id="empty-player" type="button" class="empty-player" data-choose>
              <span class="film-icon" aria-hidden="true">▶</span>
              <strong>拖入一份视频</strong><span>或点击选择本地 MP4</span>
            </button>
            <video id="player" controls playsinline preload="metadata" hidden></video>
            <div class="drop-overlay" aria-hidden="true">松开以上传 MP4</div>
          </div>
        </section>
        <aside class="tracks">
          <div class="section-heading"><h2>处理轨道</h2></div>
          <div id="tracks"></div>
          <div class="stage"><div class="section-heading"><span id="stage-label">等待视频</span><span id="stage-value" class="number"></span></div><progress id="stage-bar" max="100" value="0"></progress></div>
          <p id="index-status" class="index-note" hidden></p>
          <p id="task-error" class="error-message" hidden></p>
          <button id="retry" type="button" class="outline" hidden>重试未完成的处理</button>
        </aside>
      </div>

      <section class="results" aria-label="视频时间线">
        <div class="results-head"><h2>时间线</h2><div class="tabs" aria-label="查看层级">
          <button type="button" data-view="scenes" aria-pressed="true">场景</button>
          <button type="button" data-view="chunks" aria-pressed="false">检索块</button>
          <button type="button" data-view="evidence" aria-pressed="false">证据</button>
        </div></div>
        <div id="scope" class="scope" hidden></div>
        <div id="filters" class="filters" hidden></div>
        <div id="records"></div>
        <button id="more" type="button" class="outline" hidden>显示更多</button>
      </section>
    </main>
  </div>
</body>
</html>
