[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dovideo-python"
version = "0.1.0"
description = "ReelCue video search and editing with timestamped evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "aiohttp>=3.12.14,<4",
    "Pillow>=10,<13",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "PyMySQL>=1.1,<2",
    "redis>=5.0,<8",
    "minio>=7.2,<8",
    "celery>=5.6,<6",
    "jsonschema>=4.21,<5",
    "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/chauqaguno-design/ReelCue"

[project.scripts]
dovideo = "dovideo.cli:main"

[project.optional-dependencies]
search-index = ["qdrant-client>=1.15,<2"]
test = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/videomind/contracts" = ["docs/videomind-spec/contracts/openapi.yaml", "docs/videomind-spec/contracts/tool-registry.json"]
"share/videomind/contracts/schemas" = ["docs/videomind-spec/contracts/schemas/domain.schema.json"]
"share/videomind" = ["alembic.ini"]
"share/videomind/alembic" = ["alembic/env.py", "alembic/script.py.mako"]
"share/videomind/alembic/versions" = ["alembic/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "real_media: render and decode real media with FFmpeg",
    "live_provider: explicitly enabled probe against the configured provider",
]
