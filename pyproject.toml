[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dovideo-python"
version = "0.1.0"
description = "ReelCue video search and editing with timestamped evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "aiohttp>=3.12.14,<4",
    "Pillow>=10,<13",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.urls]
Repository = "https://github.com/chauqaguno-design/ReelCue"

[project.optional-dependencies]
search-index = ["qdrant-client>=1.15,<2"]
test = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dovideo = ["harness_skills/*.json", "harness_skills/*.md"]

[tool.setuptools.data-files]
"share/videomind" = ["alembic.ini"]
"share/videomind/alembic" = ["alembic/env.py", "alembic/script.py.mako"]
"share/videomind/alembic/versions" = ["alembic/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "real_media: render and decode real media with FFmpeg",
]
